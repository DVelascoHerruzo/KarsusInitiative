<!doctype html>
<html lang="en" data-theme="teal">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser tabs and Google Search: Google wants a square icon of 48px or a multiple of it. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/google-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050F14" />

    <!-- Add to Home Screen: opens full screen, like an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Karsus" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>Karsus – D&amp;D Initiative Tracker</title>
    <meta
      name="description"
      content="Karsus is a free D&amp;D initiative tracker for Dungeons &amp; Dragons 5e. Run combat encounters, track HP, conditions, and turn order for your whole table, and invite your players to your campaign."
    />
    <meta name="keywords" content="D&D initiative tracker, Dungeons and Dragons, DnD 5e combat tracker, initiative order, encounter tracker, tabletop RPG, campaign manager" />
    <link rel="canonical" href="https://karsusinitiative.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karsusinitiative.com/" />
    <meta property="og:title" content="Karsus – D&amp;D Initiative Tracker" />
    <meta property="og:description" content="Free D&amp;D 5e initiative tracker. Track HP, conditions, and turn order for combat encounters at your table." />
    <meta property="og:site_name" content="Karsus" />
    <meta property="og:image" content="https://karsusinitiative.com/icons/google-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Karsus emblem: a twenty-sided die around a mountain peak" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Karsus – D&amp;D Initiative Tracker" />
    <meta name="twitter:description" content="Free D&amp;D 5e initiative tracker. Track HP, conditions, and turn order for combat encounters at your table." />
    <meta name="twitter:image" content="https://karsusinitiative.com/icons/google-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Karsus Initiative Tracker",
        "alternateName": "Karsus",
        "url": "https://karsusinitiative.com/",
        "image": "https://karsusinitiative.com/icons/google-512.png",
        "description": "Free D&D 5e initiative tracker for Dungeons & Dragons combat encounters.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Karsus Initiative needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
    <script src="/kofi-init.js"></script>
  </body>
</html>
